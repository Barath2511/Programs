<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Part A - Lines and Conic Sections Graphics Algorithms</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; }
    .card { background: #fff; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
    canvas { border: 1px solid #333; background-color: #111; display: block; margin: 0 auto 15px auto; border-radius: 4px; }
    .control { margin-bottom: 10px; display: flex; justify-content: space-around; }
    button { padding: 8px 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #2980b9; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Lines & Conic Sections Algorithms</h2>
    
    <canvas id="cgCanvas" width="400" height="300"></canvas>

    <div class="control">
      <button onclick="drawBresenhamLine()">Bresenham Line</button>
      <button onclick="drawMidpointCircle()">Midpoint Circle (Conic)</button>
      <button onclick="clearCanvas()" style="background-color: #e74c3c;">Clear</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('cgCanvas');
    const ctx = canvas.getContext('2d');

    function setPixel(x, y, color = '#38bdf8') {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Bresenham's Line Algorithm
    function drawBresenhamLine() {
      clearCanvas();
      let x0 = 50, y0 = 50, x1 = 350, y1 = 250;
      let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
      let sx = (x0 < x1) ? 1 : -1;
      let sy = (y0 < y1) ? 1 : -1;
      let err = dx - dy;

      while (true) {
        setPixel(x0, y0, '#22c55e');
        if (x0 === x1 && y0 === y1) break;
        let e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x0 += sx; }
        if (e2 < dx) { err += dx; y0 += sy; }
      }
    }

    // Midpoint Circle Algorithm (Conic Section)
    function drawMidpointCircle() {
      clearCanvas();
      let xc = 200, yc = 150, r = 80;
      let x = 0, y = r;
      let p = 1 - r;

      function plotSymmetricPoints(xc, yc, x, y) {
        setPixel(xc + x, yc + y, '#f97316');
        setPixel(xc - x, yc + y, '#f97316');
        setPixel(xc + x, yc - y, '#f97316');
        setPixel(xc - x, yc - y, '#f97316');
        setPixel(xc + y, yc + x, '#f97316');
        setPixel(xc - y, yc + x, '#f97316');
        setPixel(xc + y, yc - x, '#f97316');
        setPixel(xc - y, yc - x, '#f97316');
      }

      plotSymmetricPoints(xc, yc, x, y);

      while (x < y) {
        x++;
        if (p < 0) {
          p += 2 * x + 1;
        } else {
          y--;
          p += 2 * (x - y) + 1;
        }
        plotSymmetricPoints(xc, yc, x, y);
      }
    }

    // Initial load
    drawMidpointCircle();
  </script>

</body>
</html>
